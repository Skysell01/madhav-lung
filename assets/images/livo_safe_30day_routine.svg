<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <linearGradient id="routineBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22"/>
      <stop offset="50%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="500" fill="url(#routineBg)"/>

  <!-- Top Note -->
  <rect x="370" y="30" width="460" height="34" rx="17" fill="rgba(255,255,255,0.12)" stroke="#34D399" stroke-width="1"/>
  <text x="600" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#FEF3C7" text-anchor="middle" letter-spacing="2">📸 ROUTINE BANNER PLACEHOLDER (1200 × 500 PX)</text>

  <text x="600" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="900" fill="#FFFFFF" text-anchor="middle">
    30 दिनों का लिवर रिजुविनेशन व डिटॉक्स रूटीन
  </text>
  <text x="600" y="135" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="#A7F3D0" text-anchor="middle">
    रोजाना सुबह खाली पेट सिर्फ 1 रेडी-टू-ड्रिंक शॉट • न पानी मिलाने का झंझट, न कड़वाहट
  </text>

  <!-- 4 Step Routine Cards -->
  <!-- Step 1 -->
  <g transform="translate(60, 165)">
    <rect width="250" height="260" rx="16" fill="rgba(255,255,255,0.08)" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="125" cy="50" r="30" fill="#047857"/>
    <text x="125" y="58" font-size="24" text-anchor="middle">🌅</text>
    <text x="125" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#FCD34D" text-anchor="middle">Step 1: सुबह खाली पेट</text>
    <text x="125" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#ECFDF5" text-anchor="middle">सुबह उठते ही 1 सैशे</text>
    <text x="125" y="172" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">(20ml Sachet) पिएं</text>
    <rect x="30" y="200" width="190" height="36" rx="8" fill="#047857"/>
    <text x="125" y="223" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#A7F3D0" text-anchor="middle">सीधे पिएं (Ready to Drink)</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(340, 165)">
    <rect width="250" height="260" rx="16" fill="rgba(255,255,255,0.08)" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="125" cy="50" r="30" fill="#047857"/>
    <text x="125" y="58" font-size="24" text-anchor="middle">⏱️</text>
    <text x="125" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#FCD34D" text-anchor="middle">Step 2: 30 मिनट का विराम</text>
    <text x="125" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#ECFDF5" text-anchor="middle">शॉट लेने के बाद 30 मिनट तक</text>
    <text x="125" y="172" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">चाय, कॉफी या नाश्ता न करें</text>
    <rect x="30" y="200" width="190" height="36" rx="8" fill="#047857"/>
    <text x="125" y="223" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#A7F3D0" text-anchor="middle">100% बायो-एब्जॉर्प्शन</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(620, 165)">
    <rect width="250" height="260" rx="16" fill="rgba(255,255,255,0.08)" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="125" cy="50" r="30" fill="#047857"/>
    <text x="125" y="58" font-size="24" text-anchor="middle">💧</text>
    <text x="125" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#FCD34D" text-anchor="middle">Step 3: पर्याप्त जल सेवन</text>
    <text x="125" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#ECFDF5" text-anchor="middle">दिनभर में 2.5 से 3 लीटर</text>
    <text x="125" y="172" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">गुनगुना पानी पिएं</text>
    <rect x="30" y="200" width="190" height="36" rx="8" fill="#047857"/>
    <text x="125" y="223" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#A7F3D0" text-anchor="middle">टॉक्सिन्स फ्लश-आउट</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(900, 165)">
    <rect width="250" height="260" rx="16" fill="rgba(255,255,255,0.08)" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="125" cy="50" r="30" fill="#047857"/>
    <text x="125" y="58" font-size="24" text-anchor="middle">🥗</text>
    <text x="125" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#FCD34D" text-anchor="middle">Step 4: सात्विक आहार</text>
    <text x="125" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#ECFDF5" text-anchor="middle">ज्यादा तली-भुनी चीजें व</text>
    <text x="125" y="172" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">अल्कोहल से 30 दिन परहेज</text>
    <rect x="30" y="200" width="190" height="36" rx="8" fill="#047857"/>
    <text x="125" y="223" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#A7F3D0" text-anchor="middle">स्थायी लिवर हीलिंग</text>
  </g>

  <!-- Bottom Strip -->
  <text x="600" y="470" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#99F6E4" text-anchor="middle">
    Pack of 30 Shots for 30 Days • Made for daily consistency &amp; effortless absorption
  </text>
</svg>
