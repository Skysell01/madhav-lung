<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F0A14"/>
      <stop offset="50%" stop-color="#7E1826"/>
      <stop offset="100%" stop-color="#580C17"/>
    </linearGradient>
    <linearGradient id="goldBannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="500" fill="url(#bannerBg)"/>

  <!-- Botanical Decorative Background Elements -->
  <circle cx="150" cy="250" r="180" fill="#931F30" opacity="0.3"/>
  <circle cx="1050" cy="250" r="220" fill="#B42E43" opacity="0.2"/>

  <!-- Center Content Badge -->
  <rect x="350" y="45" width="500" height="42" rx="21" fill="rgba(255,255,255,0.15)" stroke="#DCA06B" stroke-width="1.5"/>
  <text x="600" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#FEF3C7" text-anchor="middle" letter-spacing="2">📸 BANNER PLACEHOLDER (1200 × 500 PX)</text>

  <!-- Left: Big Box Graphic Representation -->
  <g transform="translate(100, 110)">
    <rect x="0" y="0" width="320" height="320" rx="20" fill="#3D060E" stroke="#DCA06B" stroke-width="3"/>
    <rect x="0" y="0" width="320" height="60" rx="20" fill="url(#goldBannerGrad)"/>
    <text x="160" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" fill="#23201D" text-anchor="middle">MADHAVBAUG CLINICAL CARE</text>
    
    <text x="160" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="900" fill="#FFFFFF" text-anchor="middle">LIVO SHOT</text>
    <text x="160" y="175" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#FCD34D" text-anchor="middle">FATTY LIVER CARE</text>
    <rect x="30" y="210" width="260" height="70" rx="10" fill="#580C17"/>
    <text x="160" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#FCD34D" text-anchor="middle">PACK OF 30 SHOTS</text>
    <text x="160" y="265" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">30 Days Intensive Course</text>
  </g>

  <!-- Right: Key Highlights & Scientific Points -->
  <g transform="translate(480, 120)">
    <rect x="0" y="0" width="620" height="300" rx="16" fill="rgba(0,0,0,0.3)" stroke="rgba(220,160,107,0.35)" stroke-width="1.5"/>
    
    <text x="35" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="900" fill="#FFFFFF">फैटी लिवर और उच्च SGOT/SGPT का</text>
    <text x="35" y="95" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" fill="#FCD34D">प्रामाणिक आयुर्वेदिक समाधान</text>

    <!-- 3 Bullet Rows -->
    <g transform="translate(35, 125)">
      <circle cx="15" cy="12" r="14" fill="#DCA06B"/>
      <text x="15" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#4F0A14" text-anchor="middle">✓</text>
      <text x="42" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Grade 1 व 2 फैटी लिवर में लिपिड डिपॉजिशन को कम करे</text>
    </g>

    <g transform="translate(35, 175)">
      <circle cx="15" cy="12" r="14" fill="#DCA06B"/>
      <text x="15" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#4F0A14" text-anchor="middle">✓</text>
      <text x="42" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">बढ़े हुए एंजाइम (SGOT, SGPT &amp; Bilirubin) को नॉर्मल लाए</text>
    </g>

    <g transform="translate(35, 225)">
      <circle cx="15" cy="12" r="14" fill="#DCA06B"/>
      <text x="15" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#4F0A14" text-anchor="middle">✓</text>
      <text x="42" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">खराब पाचन, गैस, भारीपन व सुस्ती को जड़ से समाप्त करे</text>
    </g>
  </g>

  <!-- Bottom CTA strip inside banner -->
  <rect x="0" y="460" width="1200" height="40" fill="#3D060E"/>
  <text x="600" y="485" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FCD34D" text-anchor="middle">
    100% Cash On Delivery Available Across India • Zero Advance Payment • Free Express Delivery
  </text>
</svg>
